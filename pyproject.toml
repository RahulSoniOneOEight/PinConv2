[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinconv2"
version = "0.1.0"
description = "Level 1 research and production-planning agent for PinConv2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.14,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
pinconv2 = "pinconv2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pinconv2/level2/docx.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/pinconv2"]
strict = true
